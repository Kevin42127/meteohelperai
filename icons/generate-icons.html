<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>圖示生成工具</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #357abd;
    }
  </style>
</head>
<body>
    <h1>臺灣氣象AI助手 - 圖示生成工具</h1>
  <p>點擊下方按鈕生成圖示，然後右鍵點擊圖示選擇「另存圖片」</p>
  
  <div>
    <h3>16x16 圖示</h3>
    <canvas id="icon16" width="16" height="16"></canvas>
    <button onclick="downloadIcon('icon16', 'icon16.png')">下載 16x16</button>
  </div>
  
  <div>
    <h3>48x48 圖示</h3>
    <canvas id="icon48" width="48" height="48"></canvas>
    <button onclick="downloadIcon('icon48', 'icon48.png')">下載 48x48</button>
  </div>
  
  <div>
    <h3>128x128 圖示</h3>
    <canvas id="icon128" width="128" height="128"></canvas>
    <button onclick="downloadIcon('icon128', 'icon128.png')">下載 128x128</button>
  </div>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = '#4a90e2';
      ctx.fillRect(0, 0, size, size);
      
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('氣', size / 2, size / 2);
    }

    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = function() {
      drawIcon('icon16', 16);
      drawIcon('icon48', 48);
      drawIcon('icon128', 128);
    };
  </script>
</body>
</html>
