<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>圖示尺寸調整工具</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .upload-area {
      border: 2px dashed #4a90e2;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      margin: 20px 0;
      background: #f9f9f9;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-area:hover {
      background: #f0f0f0;
      border-color: #357abd;
    }
    .upload-area.dragover {
      background: #e8f4f8;
      border-color: #357abd;
    }
    input[type="file"] {
      display: none;
    }
    .preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .preview-item {
      text-align: center;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
    }
    .preview-item canvas {
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
      background: white;
    }
    button {
      padding: 12px 24px;
      margin: 5px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.3s;
    }
    button:hover {
      background: #357abd;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .download-all {
      background: #28a745;
      margin-top: 20px;
    }
    .download-all:hover {
      background: #218838;
    }
    .info {
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>臺灣氣象AI助手 - 圖示尺寸調整工具</h1>
    <p class="info">上傳您的圖示（建議 128x128 或更大），工具會自動生成 16x16、48x48、128x128 三種尺寸</p>
    
    <div class="upload-area" id="uploadArea">
      <p>📁 點擊或拖放圖示檔案到此處</p>
      <p style="font-size: 12px; color: #999;">支援 PNG、JPG、SVG 格式</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="previewArea" style="display: none;">
      <div class="preview" id="preview"></div>
      <div style="text-align: center;">
        <button onclick="downloadAll()" class="download-all">下載所有尺寸</button>
      </div>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewArea = document.getElementById('previewArea');
    const preview = document.getElementById('preview');
    
    let imageData = null;

    uploadArea.addEventListener('click', () => fileInput.click());
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });
    
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          imageData = img;
          generateIcons();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function generateIcons() {
      preview.innerHTML = '';
      const sizes = [16, 48, 128];
      
      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imageData, 0, 0, size, size);
        
        const previewItem = document.createElement('div');
        previewItem.className = 'preview-item';
        previewItem.innerHTML = `
          <canvas id="canvas${size}" width="${size}" height="${size}"></canvas>
          <div>${size}x${size}</div>
          <button onclick="downloadIcon(${size})">下載</button>
        `;
        preview.appendChild(previewItem);
        
        const previewCanvas = document.getElementById(`canvas${size}`);
        const previewCtx = previewCanvas.getContext('2d');
        previewCtx.drawImage(imageData, 0, 0, size, size);
      });
      
      previewArea.style.display = 'block';
    }

    function downloadIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imageData, 0, 0, size, size);
      
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      [16, 48, 128].forEach(size => {
        setTimeout(() => downloadIcon(size), size * 10);
      });
    }
  </script>
</body>
</html>
